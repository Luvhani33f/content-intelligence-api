services:
  - type: web
    name: content-intelligence-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: PUBLIC_BASE_URL
        value: https://content-intelligence-api.onrender.com
      - key: PAYFAST_MERCHANT_ID
        value: ""
      - key: PAYFAST_MERCHANT_KEY
        value: ""
      - key: PAYFAST_PASSPHRASE
        value: ""
      - key: PAYFAST_MODE
        value: sandbox
      - key: PAYFAST_RETURN_URL
        value: https://content-intelligence-api.onrender.com/billing/payfast/return
      - key: PAYFAST_CANCEL_URL
        value: https://content-intelligence-api.onrender.com/billing/cancel
      - key: PAYFAST_NOTIFY_URL
        value: https://content-intelligence-api.onrender.com/billing/payfast/notify
      - key: DATABASE_URL
        fromDatabase:
          name: content-intelligence-db
          property: connectionString

databases:
  - name: content-intelligence-db
    plan: free
