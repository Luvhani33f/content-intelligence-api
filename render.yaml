services:
  - type: web
    name: content-intelligence-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: content-intelligence-db
          property: connectionString

databases:
  - name: content-intelligence-db
    plan: free
